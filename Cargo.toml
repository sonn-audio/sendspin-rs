[workspace]
members = ["sendspin-server"]

[package]
name = "sendspin"
version = "0.3.6"
edition = "2021"
authors = ["Sendspin Contributors"]
description = "Hyper-efficient Rust implementation of the Sendspin Protocol for synchronized multi-room audio streaming"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sendspin/sendspin-rs"

[features]
default = []
native-tls = [
    "tokio-tungstenite/native-tls",
    "dep:tokio-native-tls",
    "dep:native-tls",
]
# mDNS advertisement, so a server can discover a listening client. Off by default: an
# appliance whose address is configured has no use for an mDNS daemon and should not link one.
discovery = ["dep:mdns-sd"]
# The `sendspin` command-line player. Off by default, and for the same reason `discovery` is:
# a device embedding this crate should not link an argument parser or a logger to get a player.
cli = ["dep:clap", "dep:env_logger", "dep:shlex", "discovery"]
# Drive the system mixer instead of attenuating in software. Linux/ALSA only, and separate
# from `cli` so a daemon on a card with no mixer does not carry the binding.
hardware-volume = ["dep:alsa"]

[dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-tungstenite = "0.29"
tokio-native-tls = { version = "0.3", optional = true }
native-tls = { version = "0.2", optional = true }
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Utilities
log = "0.4"
uuid = { version = "1.23", features = ["v4", "serde"] }

# Audio output
cpal = "0.18"

# Audio codecs
flac-codec = "=1.3.2"
opus-rs = "=0.1.23"

# Concurrency
crossbeam = "0.8"

# Fast mutexes
parking_lot = "0.12"
typed-builder = "0.23.2"
snow = "0.10.0"
sha2 = "0.11.0"
base64 = "0.22"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
mdns-sd = { version = "0.20", optional = true }
crypto-bigint = { version = "0.7", default-features = false, features = ["alloc"] }
hmac = "0.13"
subtle = "2"
chacha20poly1305 = "0.11"
aes-gcm = "0.11"

# Command-line only, and optional so a library consumer never pulls them in.
clap = { version = "4.6", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
shlex = { version = "2.0.1", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11", optional = true }
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# `realtime` promotes cpal's WASAPI event-loop thread via MMCSS ("Pro Audio"),
# falling back to SetThreadPriority(TIME_CRITICAL). Without it the audio
# callback thread runs at normal priority and can miss engine-period deadlines
# under host load, which surfaces as callback gaps and endpoint-buffer
# starvation. Windows-only: CoreAudio already schedules callback threads
# real-time (and cpal has no macOS audio_thread_priority dependency, so the
# feature would be inert), while Linux promotion needs the dbus/RtKit variant
# (realtime-dbus) plus a system libdbus build dependency.
cpal = { version = "0.18", features = ["realtime"] }

[dev-dependencies]
tokio-test = "0.4"
base64 = "0.22"
env_logger = "0.11"
clap = { version = "4.6", features = ["derive"] }

[[bin]]
name = "sendspin"
path = "src/bin/sendspin/main.rs"
required-features = ["cli"]

[[example]]
name = "server_initiated_metadata"
required-features = ["discovery"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[[example]]
name = "secure_socket"
required-features = ["native-tls"]
